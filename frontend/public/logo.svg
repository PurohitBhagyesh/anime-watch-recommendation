<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="senpaiHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="45%" stop-color="#3db4f2" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="senpaiAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="senpaiGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hex-Shield Container -->
  <polygon
    points="50,6 88,26 88,74 50,94 12,74 12,26"
    fill="url(#senpaiHexGrad)"
    stroke="rgba(255,255,255,0.4)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Stylized Origami Anime 'A' -->
  <path
    d="M50 20 L73 66 L59 66 L54 54 L46 54 L50 42 L50 20 Z"
    fill="#ffffff"
    opacity="0.95"
  />
  <path
    d="M50 20 L27 66 L41 66 L46 54 L54 54 L50 42 L50 20 Z"
    fill="url(#senpaiAccentGrad)"
    opacity="0.90"
  />

  <!-- Dynamic Gold Underline Bar -->
  <path
    d="M30 74 L70 74 L65 82 L25 82 Z"
    fill="url(#senpaiGoldGrad)"
  />

  <!-- Anime Star Sparkle -->
  <polygon
    points="76,16 79,22 85,25 79,28 76,34 73,28 67,25 73,22"
    fill="#ffffff"
  />
</svg>
