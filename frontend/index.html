    <!-- Google Structured Data (JSON-LD) - WebSite & Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AnimeSenpai",
      "alternateName": ["Anime Senpai", "AnimeSenpai Online", "AnimeSenpai App"],
      "url": "https://animesenpai.online/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://animesenpai.online/#/discover?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Structured Data (JSON-LD) - FAQPage Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is AnimeSenpai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AnimeSenpai is a modern, high-performance anime discovery and watchlist tracking platform. It aggregates live broadcasting schedules, community ratings, character voice actors, official streaming links, and official trailers across 20,000+ anime titles."
          }
        },
        {
          "@type": "Question",
          "name": "Is AnimeSenpai free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, AnimeSenpai is completely free to use. You can browse trending seasonal anime, search the complete 20,000+ anime catalog, and organize your personal watchlist with zero fees."
          }
        },
        {
          "@type": "Question",
          "name": "How does AnimeSenpai track anime watchlists?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AnimeSenpai lets you categorize anime into Watching, Plan to Watch, Completed, Rewatching, Paused, and Dropped lists with real-time episode progress incrementing and cloud synchronization via Firebase."
          }
        },
        {
          "@type": "Question",
          "name": "Where does AnimeSenpai get its anime catalog data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AnimeSenpai syncs directly with the public AniList GraphQL v2 API, ensuring up-to-the-minute episode airing times, scores, cast members, and official synopsis information."
          }
        }
      ]
    }
    </script>

    <script>
      (function() {
        if (typeof navigator !== 'undefined' && 'modelContext' in navigator && navigator.modelContext && typeof navigator.modelContext.registerTool === 'function') {
          try {
            navigator.modelContext.registerTool({
              name: 'searchAnime',
              description: 'Search for anime titles, genres, and seasonal releases on AnimeSenpai',
              inputSchema: {
                type: 'object',
                properties: {
                  query: { type: 'string', description: 'Search keywords or anime title' }
                },
                required: ['query']
              },
              execute: function(args) {
                if (args && args.query) {
                  window.location.hash = '#/discover?search=' + encodeURIComponent(args.query);
                  return Promise.resolve({ success: true, url: window.location.href });
                }
                return Promise.reject(new Error('Missing query parameter'));
              }
            });
          } catch (e) {}
        }
      })();
    </script>
