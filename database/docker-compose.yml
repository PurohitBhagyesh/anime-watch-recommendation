version: '3.8'

services:
  # Optional PostgreSQL instance (if switching provider from SQLite to Postgres)
  postgres:
    image: postgres:16-alpine
    container_name: animesenpai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animesenpai_user
      POSTGRES_PASSWORD: animesenpai_password
      POSTGRES_DB: animesenpai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro

  # Optional Redis instance for fast recommendation caching
  redis:
    image: redis:7-alpine
    container_name: animesenpai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
